server:
  port: 8082

spring:
  application:
    name: ms-carrito
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pedidos360}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    # Confirmaciones del broker + mensajes no enrutables (se registran en log; ver RabbitConfig)
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual          # ACK explicito (ConfirmacionMensajes)
        default-requeue-rejected: false   # un rechazo NUNCA se reencola: va a la DLQ
        prefetch: 10

app:
  # ---- Apache Kafka: eventos de analitica (navegacion, pagos, fraude, transacciones) ----
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092,localhost:9094,localhost:9096}
    replicas: ${KAFKA_REPLICAS:3}             # factor de replicacion (1 si usas un solo broker en local)
    group-id: ms-carrito-precios         # consume el topico compactado del catalogo (precios oficiales)
    reintentos: 2
    topicos:
      catalogo:                          # estado de cada producto (precio/stock): COMPACTADO, clave productoId
        nombre: pedidos360.catalogo
        particiones: 3
      navegacion:                        # interacciones del usuario: alto volumen, valor de corto plazo
        nombre: pedidos360.navegacion
        particiones: 3
        retencion-ms: 604800000          # 7 dias
        min-isr: 1
      transacciones:                     # checkout, orden creada, correo enviado (antes en RabbitMQ auditoria.todos)
        nombre: pedidos360.transacciones
        particiones: 3
        retencion-ms: 2592000000         # 30 dias
        min-isr: 2
  # ---- RabbitMQ: TODOS los nombres de mensajeria de este servicio se definen aqui ----
  rabbit:
    exchange: pedidos360.events
    dlx: pedidos360.dlx
    max-reintentos: 3
    routing-keys:
      checkout: carrito.checkout         # publica (comando para ms-ordenes)
      pago-aprobado: pago.aprobado       # consume (comando de ms-pagos)
    queues:
      pago-aprobado: carrito.pago-aprobado
      pago-aprobado-dlq: carrito.pago-aprobado.dlq
  # true = permite POST /api/carrito/checkout sin pagar (solo pruebas). En produccion la compra la cierra ms-pagos.
  checkout-directo: ${CHECKOUT_DIRECTO:false}
  azure:
    tenant-id: ${AZURE_TENANT_ID:d276cca8-e687-4f20-8984-601387d11401}
    client-id: ${AZURE_CLIENT_ID:39a9591b-35f1-4165-8cf2-667a2c643920}
  security:
    require-roles: ${REQUIRE_ROLES:true}
